<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="#fff"/>
<text x="550" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#111">DIY-Mic — Minimal ESP32-C3 + INMP441 Circuit</text>
<rect x="60" y="100" width="400" height="420" rx="18" fill="#f3f6fa" stroke="#23364d" stroke-width="3"/>
<text x="260" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111">ESP32-C3 Super Mini</text>
<text x="95" y="205" font-family="Arial,sans-serif" font-size="18" fill="#111">USB-C → board power</text>
<text x="95" y="270" font-family="Arial,sans-serif" font-size="18" fill="#111">3V3</text>
<text x="95" y="320" font-family="Arial,sans-serif" font-size="18" fill="#111">GND</text>
<text x="95" y="370" font-family="Arial,sans-serif" font-size="18" fill="#111">GPIO4 — BCLK</text>
<text x="95" y="420" font-family="Arial,sans-serif" font-size="18" fill="#111">GPIO5 — WS</text>
<text x="95" y="470" font-family="Arial,sans-serif" font-size="18" fill="#111">GPIO3 — SD input</text>
<rect x="690" y="155" width="340" height="330" rx="18" fill="#fff8e8" stroke="#8b641c" stroke-width="3"/>
<text x="860" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111">INMP441 breakout</text>
<text x="735" y="260" font-family="Arial,sans-serif" font-size="18" fill="#111">VDD</text>
<text x="735" y="310" font-family="Arial,sans-serif" font-size="18" fill="#111">GND</text>
<text x="735" y="360" font-family="Arial,sans-serif" font-size="18" fill="#111">SCK / BCLK</text>
<text x="735" y="410" font-family="Arial,sans-serif" font-size="18" fill="#111">WS / LRCLK</text>
<text x="735" y="460" font-family="Arial,sans-serif" font-size="18" fill="#111">SD</text>
<path d="M460 270 H690" stroke="#d18b00" stroke-width="4" fill="none"/>
<path d="M460 320 H660 V310 H690" stroke="#222" stroke-width="4" fill="none"/>
<path d="M460 370 H630 V360 H690" stroke="#2463a6" stroke-width="4" fill="none"/>
<path d="M460 420 H650 V410 H690" stroke="#16845b" stroke-width="4" fill="none"/>
<path d="M460 470 H670 V460 H690" stroke="#b23a48" stroke-width="4" fill="none"/>
<rect x="770" y="520" width="180" height="75" rx="10" fill="#eef7f1" stroke="#16845b" stroke-width="2"/>
<text x="860" y="548" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#111">C1: 100 nF X7R</text>
<text x="860" y="572" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">across VDD and GND</text>
<path d="M790 260 V520 M930 310 V520" stroke="#8b641c" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
<text x="550" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#555">L/R → GND; CHIPEN → VDD if exposed. R1 = 100 kΩ SD-to-GND only if absent on breakout.</text>
<text x="550" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#666">No signal-line capacitors, extra regulator, or optional sensors in this first build.</text>
</svg>