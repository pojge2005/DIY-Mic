<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#111">DIY-Mic — Minimal ESP32-C3 + INMP441 Circuit</text>
  <rect x="70" y="110" width="360" height="390" rx="18" fill="#f3f6fa" stroke="#23364d" stroke-width="3"/>
  <text x="250" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111">ESP32-C3 Super Mini</text>
  <text x="105" y="205" font-family="Arial,sans-serif" font-size="18" fill="#111">USB-C → 5 V input</text>
  <text x="105" y="265" font-family="Arial,sans-serif" font-size="18" fill="#111">3V3</text>
  <text x="105" y="315" font-family="Arial,sans-serif" font-size="18" fill="#111">GND</text>
  <text x="105" y="365" font-family="Arial,sans-serif" font-size="18" fill="#111">GPIO4 — I²S BCLK</text>
  <text x="105" y="415" font-family="Arial,sans-serif" font-size="18" fill="#111">GPIO5 — I²S WS</text>
  <text x="105" y="465" font-family="Arial,sans-serif" font-size="18" fill="#111">GPIO3 — I²S SD input</text>
  <rect x="690" y="170" width="320" height="260" rx="18" fill="#fff8e8" stroke="#8b641c" stroke-width="3"/>
  <text x="850" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#111">INMP441 breakout</text>
  <text x="730" y="270" font-family="Arial,sans-serif" font-size="18" fill="#111">VDD</text>
  <text x="730" y="315" font-family="Arial,sans-serif" font-size="18" fill="#111">GND / L-R</text>
  <text x="730" y="360" font-family="Arial,sans-serif" font-size="18" fill="#111">SCK / WS / SD</text>
  <text x="730" y="405" font-family="Arial,sans-serif" font-size="16" fill="#555">CHIPEN → VDD (if exposed)</text>
  <path d="M430 265 H690" stroke="#d18b00" stroke-width="4" fill="none"/>
  <path d="M430 315 H690" stroke="#222" stroke-width="4" fill="none"/>
  <path d="M430 365 H620 V360 H690" stroke="#2463a6" stroke-width="4" fill="none"/>
  <path d="M430 415 H640 V360 H690" stroke="#16845b" stroke-width="4" fill="none"/>
  <path d="M430 465 H660 V360 H690" stroke="#b23a48" stroke-width="4" fill="none"/>
  <text x="555" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#8a5b00">3.3 V</text>
  <text x="555" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#222">Common ground</text>
  <rect x="770" y="475" width="160" height="70" rx="10" fill="#eef7f1" stroke="#16845b" stroke-width="2"/>
  <text x="850" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#111">C1: 100 nF</text>
  <text x="850" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">X7R, VDD to GND</text>
  <path d="M770 270 V475 M930 315 V475" stroke="#8b641c" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <text x="550" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#333">R1: 100 kΩ SD-to-GND only if not already fitted on the breakout.</text>
  <text x="550" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#666">No signal-line capacitors, no extra regulator, no optional sensors in this first build.</text>
</svg>